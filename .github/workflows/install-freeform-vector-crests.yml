name: Install freeform vector crests

on:
  push:
    paths:
      - '.github/workflows/install-freeform-vector-crests.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download vector crests
        run: |
          curl -L --fail 'https://to.adobe.com/xnFico4I5b63GtNq' -o assets/buy-the-diphins-freeform.svg
          curl -L --fail 'https://to.adobe.com/xDqIVlAe1oBtQ5t4' -o assets/barjalona-freeform.svg
          curl -L --fail 'https://to.adobe.com/oyjXbpAS4uSRS8ne' -o assets/snorlax-freeform.svg
          curl -L --fail 'https://to.adobe.com/UzqFIgVBCXnXLbx7' -o assets/invincibles-freeform.svg
          grep -qi '<svg' assets/buy-the-diphins-freeform.svg
          grep -qi '<svg' assets/barjalona-freeform.svg
          grep -qi '<svg' assets/snorlax-freeform.svg
          grep -qi '<svg' assets/invincibles-freeform.svg
      - name: Commit vector crests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*-freeform.svg
          git commit -m 'Add transparent vector freeform team crests'
          git push

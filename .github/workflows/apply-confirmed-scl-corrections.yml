name: Upgrade SCL data audit

on:
  push:
    paths:
      - '.github/workflows/apply-confirmed-scl-corrections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upgrade integrity audit
        run: node scripts/upgrade-scl-audit-best-team.mjs

      - name: Commit audit upgrade
        shell: bash
        run: |
          if git diff --quiet -- scripts/audit-sleeper-vs-site.mjs; then
            echo "No audit changes produced."
            exit 1
          fi
          git config user.name "scl-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-sleeper-vs-site.mjs
          git commit -m "Verify Sleeper Best Team reports in integrity audit"
          git push

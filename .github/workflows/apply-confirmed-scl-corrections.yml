name: Apply confirmed SCL corrections

on:
  push:
    paths:
      - '.github/workflows/apply-confirmed-scl-corrections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply commissioner-confirmed corrections
        run: node scripts/apply-confirmed-scl-corrections.mjs

      - name: Commit corrected SCL data
        shell: bash
        run: |
          if git diff --quiet -- script.js; then
            echo "No site-data changes produced."
            exit 1
          fi
          git config user.name "scl-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Apply confirmed Sleeper data corrections"
          git push

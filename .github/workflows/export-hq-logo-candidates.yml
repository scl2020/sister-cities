name: Export HQ logo candidates

on:
  push:
    paths:
      - '.github/workflows/export-hq-logo-candidates.yml'

permissions:
  contents: write

env:
  EXPORT_NAME: hq-logo-candidates

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}
          path: |
            assets/invincibles-logo-v2.jpg
            assets/snorlax.png
            assets/barjalona.png
            assets/buy-the-diphins-2026.jpg
          if-no-files-found: error
          retention-days: 1
      - name: Record run id
        run: |
          mkdir -p data/tmp
          echo "${GITHUB_RUN_ID}" > data/tmp/hq-logo-export-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tmp/hq-logo-export-run-id.txt
          git commit -m "Record HQ logo export run" || exit 0
          git push

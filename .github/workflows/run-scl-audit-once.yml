name: Run post-correction SCL audit once

on:
  push:
    paths:
      - '.github/workflows/run-scl-audit-once.yml'

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit and capture result
        id: run_audit
        shell: bash
        run: |
          set +e
          node scripts/audit-sleeper-vs-site.mjs > /tmp/scl-audit.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/scl-audit.log
          exit 0

      - name: Commit updated audit report
        if: steps.run_audit.outputs.exit_code == '0'
        shell: bash
        run: |
          git add data/audits/sleeper-vs-site.json data/audits/sleeper-vs-site.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged."
            exit 0
          fi
          git config user.name "scl-audit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit SCL site data against Sleeper"
          git push

      - name: Report audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.run_audit.outputs.exit_code }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$EXIT_CODE" = "0" ]; then
            gh issue comment 2 --body "Post-correction SCL integrity audit: **success**. Run: ${RUN_URL}"
          else
            tail -n 25 /tmp/scl-audit.log > /tmp/scl-audit-tail.txt || true
            gh issue comment 2 --body "Post-correction SCL integrity audit: **FAILED** (exit ${EXIT_CODE}). Run: ${RUN_URL}\n\n\`\`\`\n$(cat /tmp/scl-audit-tail.txt)\n\`\`\`"
            exit 1
          fi

name: Cleanup freeform vector backgrounds

on:
  push:
    paths:
      - '.github/workflows/cleanup-freeform-vector-backgrounds.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove traced outside-canvas paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          removals = {
              'assets/buy-the-diphins-freeform.svg': 1,
              'assets/barjalona-freeform.svg': 4,
              'assets/invincibles-freeform.svg': 1,
          }

          for filename, count in removals.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              cleaned, removed = re.subn(r'<path\b[^>]*?/>\s*', '', text, count=count)
              if removed != count:
                  raise SystemExit(f'{filename}: expected to remove {count} path(s), removed {removed}')
              path.write_text(cleaned, encoding='utf-8')
          PY

      - name: Verify SVGs
        run: |
          grep -qi '<svg' assets/buy-the-diphins-freeform.svg
          grep -qi '<svg' assets/barjalona-freeform.svg
          grep -qi '<svg' assets/snorlax-freeform.svg
          grep -qi '<svg' assets/invincibles-freeform.svg

      - name: Commit cleaned vectors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*-freeform.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Remove traced backgrounds from freeform crests'
          git push

name: Export freeform logo assets

on:
  push:
    paths:
      - '.github/workflows/export-freeform-logo-assets.yml'

permissions:
  contents: write

env:
  EXPORT_NAME: freeform-logo-source-assets

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Package source logos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}
          path: |
            assets/buy-the-diphins-2026.jpg
            assets/barjalona.png
            assets/invincibles-logo-2026-final.webp
            assets/snorlax-hq-2026.webp
          if-no-files-found: error
          retention-days: 1

      - name: Publish export run id
        shell: bash
        run: |
          mkdir -p data/tmp
          printf '%s\n' "${GITHUB_RUN_ID}" > data/tmp/freeform-logo-export-run-id.txt
          git config user.name "scl-logo-export-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tmp/freeform-logo-export-run-id.txt
          git commit -m "Record freeform logo export run" || exit 0
          git push
